<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Storybook Wooden Metric Ruler -->
  <defs>
    <filter id="ruler-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#263D64" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#ruler-shadow)" transform="rotate(-25 250 250)">
    <!-- Main Ruler Body -->
    <rect x="50" y="210" width="400" height="80" rx="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="10"/>

    <!-- Wood grain accent -->
    <path d="M70 230 Q200 225 380 230" stroke="#FDE047" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M90 270 Q250 265 420 270" stroke="#FDE047" stroke-width="4" fill="none" opacity="0.6"/>

    <!-- Centimeter & Millimeter Measurement Ticks -->
    <!-- Major ticks (cm) -->
    <line x1="80" y1="210" x2="80" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="210" x2="130" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="180" y1="210" x2="180" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="230" y1="210" x2="230" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="280" y1="210" x2="280" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="330" y1="210" x2="330" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="380" y1="210" x2="380" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>
    <line x1="420" y1="210" x2="420" y2="245" stroke="#854D0E" stroke-width="6" stroke-linecap="round"/>

    <!-- Minor ticks (mm) -->
    <line x1="105" y1="210" x2="105" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="210" x2="155" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <line x1="205" y1="210" x2="205" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <line x1="255" y1="210" x2="255" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <line x1="305" y1="210" x2="305" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <line x1="355" y1="210" x2="355" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>
    <line x1="400" y1="210" x2="400" y2="230" stroke="#A16207" stroke-width="4" stroke-linecap="round"/>

    <!-- Numbers along ruler -->
    <text x="80" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">0</text>
    <text x="130" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">1</text>
    <text x="180" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">2</text>
    <text x="230" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">3</text>
    <text x="280" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">4</text>
    <text x="330" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">5</text>
    <text x="380" y="275" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">6</text>
  </g>
</svg>
